<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<defs>
  <filter id="gr"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gs"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gb"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .spin{animation:spin 18s linear infinite;transform-origin:150px 150px}
    .p1{animation:pulse 4s ease-in-out infinite}
    .p2{animation:pulse 4s ease-in-out infinite 0.8s}
    .p3{animation:pulse 4s ease-in-out infinite 1.6s}
    .p4{animation:pulse 4s ease-in-out infinite 2.4s}
    .p5{animation:pulse 4s ease-in-out infinite 3.2s}
    .glow{animation:glow 4s ease-in-out infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.12}50%{opacity:.42}}
    @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
</defs>
